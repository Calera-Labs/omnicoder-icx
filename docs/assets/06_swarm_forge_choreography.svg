<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" role="img" aria-label="Diagram of OmniCoder Swarm Forge showing Wave 0 interface freeze, isolated git worktrees, and Two-Phase Commit staging gate">
  <title>The Swarm Forge: Parallel Worktree Isolation and Two-Phase Commit Merge Gate</title>
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bg6)"/>

  <!-- Header -->
  <text x="600" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF">The Swarm Forge: Coordinated Parallel Worktrees &amp; Two-Phase Commit</text>
  <text x="600" y="72" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#94A3B8">How OmniCoder isolates parallel builders and validates combined changes before touching the main branch</text>

  <!-- Step 1: Wave 0 Blueprint Freeze -->
  <g transform="translate(45, 102)">
    <rect width="250" height="470" rx="14" fill="#1E293B" fill-opacity="0.65" stroke="#F59E0B" stroke-width="2"/>
    <rect x="20" y="20" width="110" height="26" rx="13" fill="#451A03"/>
    <text x="75" y="37" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#FBBF24">STEP 1: WAVE 0</text>
    <text x="20" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Freeze the Plugs</text>
    <text x="20" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#FCD34D">Interface Crystallization</text>

    <rect x="20" y="118" width="210" height="145" rx="10" fill="#090D16" stroke="#78350F" stroke-width="1.5"/>
    <text x="125" y="146" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">Shared Blueprint Contract</text>
    <text x="34" y="174" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">type Engine interface {</text>
    <text x="34" y="194" font-family="Consolas, monospace" font-size="11" fill="#34D399">  Step(dt Decimal) error</text>
    <text x="34" y="214" font-family="Consolas, monospace" font-size="11" fill="#38BDF8">  Sync() MerkleSeal</text>
    <text x="34" y="234" font-family="Consolas, monospace" font-size="11" fill="#E2E8F0">}</text>

    <text x="20" y="294" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Why It Matters:</text>
    <text x="20" y="316" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Before parallel workers start,</text>
    <text x="20" y="334" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">shared types and function</text>
    <text x="20" y="352" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">signatures are committed so</text>
    <text x="20" y="370" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">modules compile against one API.</text>

    <rect x="20" y="402" width="210" height="46" rx="8" fill="#451A03"/>
    <text x="125" y="430" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#FDE68A">Shared Interface Contract</text>
  </g>

  <!-- Step 2: Parallel Worktrees -->
  <g transform="translate(320, 102)">
    <rect width="310" height="470" rx="14" fill="#1E293B" fill-opacity="0.65" stroke="#38BDF8" stroke-width="2"/>
    <rect x="20" y="20" width="140" height="26" rx="13" fill="#0C4A6E"/>
    <text x="90" y="37" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#38BDF8">STEP 2: ISOLATION</text>
    <text x="20" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Private Workbenches</text>
    <text x="20" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#7DD3FC">Sub-85ms Git Worktrees + Junctions</text>

    <!-- 3 Worker Boxes -->
    <g transform="translate(20, 118)">
      <rect width="270" height="72" rx="10" fill="#090D16" stroke="#0284C7" stroke-width="1.5"/>
      <circle cx="30" cy="36" r="14" fill="#0C4A6E"/>
      <text x="30" y="41" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#38BDF8">W1</text>
      <text x="56" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Builder A: Core &amp; Engine</text>
      <text x="56" y="50" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Isolated worktree • Spun up in 82ms</text>
    </g>

    <g transform="translate(20, 202)">
      <rect width="270" height="72" rx="10" fill="#090D16" stroke="#6366F1" stroke-width="1.5"/>
      <circle cx="30" cy="36" r="14" fill="#1E1B4B"/>
      <text x="30" y="41" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#A5B4FC">W2</text>
      <text x="56" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Builder B: Network Engine</text>
      <text x="56" y="50" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Isolated worktree • Spun up in 79ms</text>
    </g>

    <g transform="translate(20, 286)">
      <rect width="270" height="72" rx="10" fill="#090D16" stroke="#10B981" stroke-width="1.5"/>
      <circle cx="30" cy="36" r="14" fill="#064E3B"/>
      <text x="30" y="41" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#34D399">W3</text>
      <text x="56" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Builder C: Storage &amp; Audit</text>
      <text x="56" y="50" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Isolated worktree • Spun up in 84ms</text>
    </g>

    <rect x="20" y="402" width="270" height="46" rx="8" fill="#0C4A6E"/>
    <text x="155" y="430" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#BAE6FD">Disjoint File Ownership Per Wave</text>
  </g>

  <!-- Step 3: 2PC Reconciler & Results -->
  <g transform="translate(655, 102)">
    <rect width="500" height="470" rx="14" fill="#1E293B" fill-opacity="0.65" stroke="#10B981" stroke-width="2"/>
    <rect x="20" y="20" width="195" height="26" rx="13" fill="#064E3B"/>
    <text x="117" y="37" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#34D399">STEP 3: SAFE MERGE &amp; PROOF</text>
    <text x="20" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF">Two-Phase Commit (2PC) Inspection Gate</text>
    <text x="20" y="96" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6EE7B7">Nothing touches your main branch until combined changes pass tests</text>

    <!-- Staging Flowchart -->
    <g transform="translate(20, 118)">
      <rect width="460" height="128" rx="10" fill="#090D16" stroke="#065F46" stroke-width="1.5"/>
      <text x="24" y="30" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#34D399">How the Staging Gate Works:</text>
      <text x="24" y="56" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">1. <tspan font-weight="700" fill="#FFFFFF">Dry-Run Staging Room:</tspan> Combines all builders' work in a staging tree.</text>
      <text x="24" y="80" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">2. <tspan font-weight="700" fill="#FFFFFF">Integration Check:</tspan> Runs full compiler &amp; test suite on combined tree.</text>
      <text x="24" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">3. <tspan font-weight="700" fill="#FFFFFF">Atomic Commit:</tspan> Promotes passing code + prunes temp worktrees.</text>
    </g>

    <!-- Verified Benchmark Box: 7-Module Go Workspace -->
    <g transform="translate(20, 266)">
      <rect width="460" height="182" rx="12" fill="#064E3B" fill-opacity="0.45" stroke="#10B981" stroke-width="1.5"/>
      <text x="24" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#A7F3D0">SYNTHETIC ORCHESTRATION BENCHMARK (7 GO MODULES)</text>
      <text x="24" y="45" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#6EE7B7">Measures worktree + compile + merge overhead (excludes LLM inference time)</text>

      <text x="24" y="74" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Serial Execution:</text>
      <rect x="200" y="61" width="220" height="18" rx="4" fill="#475569"/>
      <text x="410" y="74" text-anchor="end" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">582.68 ms</text>

      <text x="24" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34D399">Swarm Wave Execution:</text>
      <rect x="200" y="91" width="54" height="18" rx="4" fill="#10B981"/>
      <text x="264" y="104" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#34D399">143.02 ms (4.07x Overhead Speedup)</text>

      <line x1="24" y1="122" x2="436" y2="122" stroke="#065F46" stroke-width="1"/>
      <text x="24" y="146" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">✓ 42 / 42 Package Tests Passing   ✓ 10.42 MB Native Binary Built</text>
      <text x="24" y="168" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6EE7B7">✓ 0 Merge Collisions   ✓ Worktrees Pruned Cleanly</text>
    </g>
  </g>
</svg>
