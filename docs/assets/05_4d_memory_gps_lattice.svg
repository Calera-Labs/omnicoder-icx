<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" role="img" aria-label="Diagram of the 5 zoom levels of OmniCoder volumetric memory from 0D Point Facts to 4D Time Vault">
  <title>The 4D Software GPS: 5 Zoom Levels of Repository Memory (0D to 4D)</title>
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="dimCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg5)"/>

  <!-- Header -->
  <text x="600" y="46" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">The 4D Software GPS: How OmniCoder Remembers Without Re-Reading</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#94A3B8">Instead of treating code like a flat novel, OmniCoder organizes your project into 5 living zoom levels</text>

  <!-- 5 Dimension Columns -->
  <!-- 0D -->
  <g transform="translate(36, 108)">
    <rect width="212" height="410" rx="14" fill="url(#dimCard)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="28" rx="8" fill="#0C4A6E"/>
    <text x="52" y="39" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#38BDF8">0D</text>
    <text x="20" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Point Facts</text>
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">"The Vital Signs"</text>

    <!-- Icon: Single Glowing Point -->
    <circle cx="106" cy="155" r="36" fill="#0C4A6E" fill-opacity="0.5" stroke="#38BDF8" stroke-width="1.5"/>
    <circle cx="106" cy="155" r="10" fill="#38BDF8"/>

    <text x="20" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">What It Stores:</text>
    <text x="20" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Exact line counts</text>
    <text x="20" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• File fingerprints (SHA-256)</text>
    <text x="20" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Pass/Fail status flags</text>

    <rect x="16" y="325" width="180" height="68" rx="8" fill="#090D16" stroke="#1E293B"/>
    <text x="26" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Everyday Analogy:</text>
    <text x="26" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Checking a house's address</text>
    <text x="26" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">and alarm light in 1 millisecond.</text>
  </g>

  <!-- 1D -->
  <g transform="translate(264, 108)">
    <rect width="212" height="410" rx="14" fill="url(#dimCard)" stroke="#6366F1" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="28" rx="8" fill="#1E1B4B"/>
    <text x="52" y="39" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#A5B4FC">1D</text>
    <text x="20" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Code Ribbon</text>
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">"The Subway Line"</text>

    <!-- Icon: Linear Ribbon -->
    <line x1="46" y1="155" x2="166" y2="155" stroke="#6366F1" stroke-width="4"/>
    <circle cx="56" cy="155" r="7" fill="#A5B4FC"/>
    <circle cx="106" cy="155" r="9" fill="#FFFFFF" stroke="#6366F1" stroke-width="3"/>
    <circle cx="156" cy="155" r="7" fill="#A5B4FC"/>

    <text x="20" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">What It Stores:</text>
    <text x="20" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Exact 5–20 line code slices</text>
    <text x="20" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Compact &lt;nav:ribbon&gt;</text>
    <text x="20" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Strictly under 160 tokens</text>

    <rect x="16" y="325" width="180" height="68" rx="8" fill="#090D16" stroke="#1E293B"/>
    <text x="26" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#A5B4FC">Everyday Analogy:</text>
    <text x="26" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">The strip map above a train</text>
    <text x="26" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">door showing the next 5 stops.</text>
  </g>

  <!-- 2D -->
  <g transform="translate(492, 108)">
    <rect width="212" height="410" rx="14" fill="url(#dimCard)" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="28" rx="8" fill="#2E1065"/>
    <text x="52" y="39" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#C4B5FD">2D</text>
    <text x="20" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Symbol Index</text>
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#C4B5FD">"The Yellow Pages"</text>

    <!-- Icon: 2D Grid -->
    <g transform="translate(66, 123)">
      <rect width="80" height="64" rx="6" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <line x1="0" y1="21" x2="80" y2="21" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="0" y1="43" x2="80" y2="43" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="35" y1="0" x2="35" y2="64" stroke="#8B5CF6" stroke-width="1.5"/>
    </g>

    <text x="20" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">What It Stores:</text>
    <text x="20" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Every function &amp; class name</text>
    <text x="20" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Exact file &amp; line numbers</text>
    <text x="20" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• BM25 search ranking</text>

    <rect x="16" y="325" width="180" height="68" rx="8" fill="#090D16" stroke="#1E293B"/>
    <text x="26" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">Everyday Analogy:</text>
    <text x="26" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">A building directory in the</text>
    <text x="26" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">lobby listing every office.</text>
  </g>

  <!-- 3D -->
  <g transform="translate(720, 108)">
    <rect width="212" height="410" rx="14" fill="url(#dimCard)" stroke="#10B981" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="28" rx="8" fill="#064E3B"/>
    <text x="52" y="39" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#34D399">3D</text>
    <text x="20" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Ripple Web</text>
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34D399">"The Wiring Diagram"</text>

    <!-- Icon: 3D Graph -->
    <g transform="translate(106, 155)">
      <line x1="0" y1="-26" x2="-32" y2="20" stroke="#10B981" stroke-width="2"/>
      <line x1="0" y1="-26" x2="32" y2="20" stroke="#10B981" stroke-width="2"/>
      <line x1="-32" y1="20" x2="32" y2="20" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
      <circle cx="0" cy="-26" r="9" fill="#10B981"/>
      <circle cx="-32" cy="20" r="7" fill="#34D399"/>
      <circle cx="32" cy="20" r="7" fill="#34D399"/>
    </g>

    <text x="20" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">What It Stores:</text>
    <text x="20" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Who calls whom (5 hops)</text>
    <text x="20" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Class setup (__init__) slices</text>
    <text x="20" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Helper method links</text>

    <rect x="16" y="325" width="180" height="68" rx="8" fill="#090D16" stroke="#1E293B"/>
    <text x="26" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#34D399">Everyday Analogy:</text>
    <text x="26" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Seeing which rooms lose</text>
    <text x="26" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">power if you flip Breaker #4.</text>
  </g>

  <!-- 4D -->
  <g transform="translate(948, 108)">
    <rect width="216" height="410" rx="14" fill="url(#dimCard)" stroke="#F59E0B" stroke-width="2"/>
    <rect x="20" y="20" width="64" height="28" rx="8" fill="#451A03"/>
    <text x="52" y="39" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" font-weight="800" fill="#FBBF24">4D</text>
    <text x="20" y="76" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Time Vault</text>
    <text x="20" y="98" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FBBF24">"The Flight Recorder"</text>

    <!-- Icon: Time Layers -->
    <g transform="translate(108, 155)">
      <rect x="-36" y="-22" width="48" height="32" rx="4" fill="#451A03" stroke="#F59E0B" stroke-width="1.5"/>
      <rect x="-24" y="-12" width="48" height="32" rx="4" fill="#78350F" stroke="#FBBF24" stroke-width="1.5"/>
      <rect x="-12" y="-2" width="48" height="32" rx="4" fill="#F59E0B"/>
    </g>

    <text x="20" y="226" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#E2E8F0">What It Stores:</text>
    <text x="20" y="248" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Actuation receipts (&lt;170 tok)</text>
    <text x="20" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Compare-And-Swap locks</text>
    <text x="20" y="288" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">• Merkle cryptographic trail</text>

    <rect x="16" y="325" width="184" height="68" rx="8" fill="#090D16" stroke="#1E293B"/>
    <text x="26" y="346" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Everyday Analogy:</text>
    <text x="26" y="364" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">An airplane's black box that</text>
    <text x="26" y="380" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">remembers every past repair.</text>
  </g>
</svg>
