<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="100%" height="100%" role="img" aria-label="Diagram of OmniCoder 3-layer self-repair system: deterministic pre-healer, 5-tier code splicer, and 3-candidate tournament">
  <title>How OmniCoder Repairs Code: Pre-Healer, 5-Tier Splicer, and 3-Candidate Tournament</title>
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="card7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="560" rx="18" fill="url(#bg7)"/>

  <!-- Header -->
  <text x="600" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">How OmniCoder Repairs Mistakes: Auto-Heal &amp; The 3-Candidate Tournament</text>
  <text x="600" y="72" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#94A3B8">Combining deterministic AST pre-healing, fuzzy indentation splicing, and parallel candidate evaluation</text>

  <!-- Step 1: Deterministic Pre-Heal -->
  <g transform="translate(42, 106)">
    <rect width="250" height="410" rx="14" fill="url(#card7)" stroke="#38BDF8" stroke-width="2"/>
    <rect x="18" y="18" width="162" height="26" rx="13" fill="#0C4A6E"/>
    <text x="99" y="35" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#38BDF8">DEFENSE 1: PRE-HEAL</text>
    <text x="18" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Deterministic Syntax &amp;</text>
    <text x="18" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Import Injector</text>

    <rect x="18" y="116" width="214" height="120" rx="10" fill="#090D16" stroke="#0284C7"/>
    <text x="30" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Missing standard import?</text>
    <text x="30" y="164" font-family="Consolas, monospace" font-size="11" fill="#FDA4AF">NameError: 'math' missing</text>
    <text x="30" y="188" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34D399">Injected Deterministically:</text>
    <text x="30" y="210" font-family="Consolas, monospace" font-size="11" fill="#6EE7B7">+ import math</text>

    <text x="18" y="268" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Before spending an LLM turn,</text>
    <text x="18" y="286" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">OmniCoder's Go pre-healer</text>
    <text x="18" y="304" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">resolves known missing stdlib</text>
    <text x="18" y="322" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">imports in under 1 millisecond.</text>

    <rect x="18" y="350" width="214" height="42" rx="8" fill="#0C4A6E"/>
    <text x="125" y="376" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#BAE6FD">Zero LLM Tokens Used</text>
  </g>

  <!-- Step 2: 5-Tier Surgical Splicer -->
  <g transform="translate(314, 106)">
    <rect width="265" height="410" rx="14" fill="url(#card7)" stroke="#8B5CF6" stroke-width="2"/>
    <rect x="18" y="18" width="165" height="26" rx="13" fill="#2E1065"/>
    <text x="100" y="35" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#C4B5FD">DEFENSE 2: 5-TIER ZIP</text>
    <text x="18" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">5-Tier Surgical</text>
    <text x="18" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Code Splicer</text>

    <!-- 5 Tiers stack -->
    <g transform="translate(18, 114)">
      <rect width="229" height="34" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="14" y="22" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#E0E7FF">Tier 1: Exact Character Match</text>

      <rect y="42" width="229" height="34" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
      <text x="14" y="64" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#E0E7FF">Tier 2: Trimmed End-Spaces</text>

      <rect y="84" width="229" height="34" rx="6" fill="#1E1B4B" stroke="#8B5CF6"/>
      <text x="14" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#DDD6FE">Tier 3: Blank-Line Tolerant</text>

      <rect y="126" width="229" height="34" rx="6" fill="#2E1065" stroke="#A855F7"/>
      <text x="14" y="148" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#F3E8FF">Tier 4: Relative Indent Alignment</text>

      <rect y="168" width="229" height="34" rx="6" fill="#3B0764" stroke="#D946EF"/>
      <text x="14" y="190" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FAE8FF">Tier 5: Ellipsis Anchor Matching</text>
    </g>

    <rect x="18" y="350" width="229" height="42" rx="8" fill="#2E1065"/>
    <text x="132" y="376" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#DDD6FE">Resilient Indentation Fallback</text>
  </g>

  <!-- Step 3: The 3-Idea Speculative Tournament -->
  <g transform="translate(601, 106)">
    <rect width="557" height="410" rx="14" fill="url(#card7)" stroke="#10B981" stroke-width="2"/>
    <rect x="20" y="18" width="225" height="26" rx="13" fill="#064E3B"/>
    <text x="132" y="35" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="800" fill="#34D399">DEFENSE 3: BEAM-K TOURNAMENT</text>
    <text x="20" y="72" font-family="Inter, Segoe UI, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF">Three Competing Repair Candidates Race in Parallel</text>
    <text x="20" y="94" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#6EE7B7">Evaluates k=3 candidate patches against the reproducer &amp; existing repo tests</text>

    <!-- 3 Candidate Boxes -->
    <g transform="translate(20, 114)">
      <rect width="162" height="145" rx="10" fill="#090D16" stroke="#38BDF8" stroke-width="1.5"/>
      <text x="81" y="28" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">Candidate Alpha (α)</text>
      <text x="81" y="48" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Primary Window</text>
      <text x="81" y="66" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Direct Surgical Fix</text>
      <rect x="18" y="88" width="126" height="38" rx="6" fill="#064E3B"/>
      <text x="81" y="112" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#34D399">✓ TESTS PASS</text>
    </g>

    <g transform="translate(197, 114)">
      <rect width="162" height="145" rx="10" fill="#090D16" stroke="#A855F7" stroke-width="1.5"/>
      <text x="81" y="28" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#C4B5FD">Candidate Beta (β)</text>
      <text x="81" y="48" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Secondary Window</text>
      <text x="81" y="66" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Helper Method Fix</text>
      <rect x="18" y="88" width="126" height="38" rx="6" fill="#1E293B"/>
      <text x="81" y="112" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Backup Candidate</text>
    </g>

    <g transform="translate(374, 114)">
      <rect width="162" height="145" rx="10" fill="#090D16" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="81" y="28" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#FBBF24">Candidate Gamma (γ)</text>
      <text x="81" y="48" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#CBD5E1">Boundary Guard</text>
      <text x="81" y="66" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Edge-Case Shield</text>
      <rect x="18" y="88" width="126" height="38" rx="6" fill="#1E293B"/>
      <text x="81" y="112" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#94A3B8">Backup Candidate</text>
    </g>

    <!-- Root-Cause First Callout -->
    <g transform="translate(20, 276)">
      <rect width="516" height="60" rx="10" fill="#090D16" stroke="#10B981" stroke-width="1.2"/>
      <text x="18" y="24" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#34D399">&quot;Diagnosis Before Surgery&quot; Schema (root_cause First):</text>
      <text x="18" y="44" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#E2E8F0">Every repair card requires a concise root_cause diagnosis field before emitting code.</text>
    </g>

    <rect x="20" y="350" width="516" height="42" rx="8" fill="#064E3B"/>
    <text x="278" y="376" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#A7F3D0">Scored by Reproducer Pass + Pre-Existing Repo Test Verification</text>
  </g>
</svg>
