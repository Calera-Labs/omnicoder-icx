<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="100%" height="100%" role="img" aria-label="Comparison between traditional cumulative chat context loops and OmniCoder sub-300-token decision cards">
  <title>Cumulative Chat History vs. OmniCoder 300-Token Decision Cards</title>
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="redPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F1218"/>
      <stop offset="100%" stop-color="#140C10"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1F1C"/>
      <stop offset="100%" stop-color="#091518"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="620" rx="18" fill="url(#bg2)"/>

  <!-- Header -->
  <text x="600" y="46" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">Why Traditional AI Coding Loops Accumulate Noise—And How OmniCoder Avoids It</text>
  <text x="600" y="74" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="15" fill="#94A3B8">Think of fixing software like repairing a leaky pipe on the 14th floor of a skyscraper</text>

  <!-- LEFT PANEL: Traditional AI (The 500-Page Binder) -->
  <g transform="translate(45, 100)">
    <rect width="535" height="485" rx="16" fill="url(#redPanel)" stroke="#F43F5E" stroke-width="2"/>
    <rect x="24" y="22" width="190" height="28" rx="14" fill="#881337"/>
    <text x="119" y="41" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#FDA4AF">CUMULATIVE CHAT LOOP</text>
    <text x="24" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">"The 500-Page Binder on a Messy Desk"</text>
    <text x="24" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#FDA4AF">Re-sending full files, bash outputs, and prior turns on every step</text>

    <!-- Visual: Stacking Paper Pile Growing Every Turn -->
    <g transform="translate(30, 128)">
      <rect width="475" height="175" rx="12" fill="#0F172A" stroke="#4C1D24" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#F43F5E">Prompt tokens re-read on each turn:</text>

      <!-- Turn Bars showing quadratic growth -->
      <text x="20" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Step 1:</text>
      <rect x="85" y="45" width="55" height="18" rx="4" fill="#FB7185"/>
      <text x="148" y="58" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">15,000 tokens read</text>

      <text x="20" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Step 5:</text>
      <rect x="85" y="73" width="145" height="18" rx="4" fill="#F43F5E"/>
      <text x="238" y="86" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#94A3B8">80,000 tokens re-read</text>

      <text x="20" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Step 10:</text>
      <rect x="85" y="101" width="245" height="18" rx="4" fill="#E11D48"/>
      <text x="338" y="114" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#FDA4AF">160,000 tokens (Attention Dilution)</text>

      <text x="20" y="142" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Step 15:</text>
      <rect x="85" y="129" width="355" height="18" rx="4" fill="#BE123C"/>
      <text x="260" y="143" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF">200,000+ TOKENS — CONTEXT SATURATION</text>
    </g>

    <!-- 3 Bullet Consequences -->
    <g transform="translate(30, 322)">
      <circle cx="14" cy="14" r="10" fill="#881337"/>
      <text x="14" y="18" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#FDA4AF">1</text>
      <text x="34" y="18" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Information Overload ("Lost in the Middle")</text>
      <text x="34" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Old error logs and whole files bury the 5 lines of code that actually matter.</text>

      <circle cx="14" cy="64" r="10" fill="#881337"/>
      <text x="14" y="68" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#FDA4AF">2</text>
      <text x="34" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Quadratic Token Billing</text>
      <text x="34" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Because APIs bill per input token on every turn, re-sending history multiplies cost.</text>

      <circle cx="14" cy="114" r="10" fill="#881337"/>
      <text x="14" y="118" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#FDA4AF">3</text>
      <text x="34" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Typical Multi-Turn Agent Footprint</text>
      <text x="34" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#FDA4AF" font-weight="700">~42k to 185k+ tokens • 1.5 to 8 minutes per issue</text>
    </g>
  </g>

  <!-- RIGHT PANEL: OmniCoder-ICX (The GPS & 300-Token Index Card) -->
  <g transform="translate(620, 100)">
    <rect width="535" height="485" rx="16" fill="url(#greenPanel)" stroke="#10B981" stroke-width="2"/>
    <rect x="24" y="22" width="225" height="28" rx="14" fill="#064E3B"/>
    <text x="136" y="41" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6EE7B7">THE OMNICODER WAY: BOUNDED</text>
    <text x="24" y="82" font-family="Inter, Segoe UI, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">"A 4D GPS Map + A 300-Token Index Card"</text>
    <text x="24" y="106" font-family="Inter, Segoe UI, sans-serif" font-size="13" fill="#6EE7B7">Decoupled Volumetric Memory + Micro-Decision Cards + Clean Desk Reset</text>

    <!-- Visual: Constant Tiny Index Cards -->
    <g transform="translate(30, 128)">
      <rect width="475" height="175" rx="12" fill="#0F172A" stroke="#065F46" stroke-width="1.5"/>
      <text x="20" y="28" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34D399">Bounded prompt tokens on each decision card:</text>

      <!-- Step 1-4 Tiny Index Cards -->
      <g transform="translate(22, 45)">
        <rect width="98" height="108" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
        <text x="49" y="22" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#34D399">CARD 1</text>
        <text x="49" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Locate Fault</text>
        <text x="49" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#10B981">240 tokens</text>
        <rect x="12" y="78" width="74" height="18" rx="4" fill="#064E3B"/>
        <text x="49" y="91" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">DESK WIPED</text>
      </g>

      <g transform="translate(134, 45)">
        <rect width="98" height="108" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
        <text x="49" y="22" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#34D399">CARD 2</text>
        <text x="49" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Check Callers</text>
        <text x="49" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#10B981">280 tokens</text>
        <rect x="12" y="78" width="74" height="18" rx="4" fill="#064E3B"/>
        <text x="49" y="91" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">DESK WIPED</text>
      </g>

      <g transform="translate(246, 45)">
        <rect width="98" height="108" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
        <text x="49" y="22" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#34D399">CARD 3</text>
        <text x="49" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Splice Patch</text>
        <text x="49" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#10B981">265 tokens</text>
        <rect x="12" y="78" width="74" height="18" rx="4" fill="#064E3B"/>
        <text x="49" y="91" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#A7F3D0">DESK WIPED</text>
      </g>

      <g transform="translate(358, 45)">
        <rect width="98" height="108" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
        <text x="49" y="22" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">CARD 4</text>
        <text x="49" y="44" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Verify Seal</text>
        <text x="49" y="64" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="13" font-weight="800" fill="#38BDF8">190 tokens</text>
        <rect x="12" y="78" width="74" height="18" rx="4" fill="#0C4A6E"/>
        <text x="49" y="91" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#BAE6FD">VERIFIED</text>
      </g>
    </g>

    <!-- 3 Bullet Benefits -->
    <g transform="translate(30, 322)">
      <circle cx="14" cy="14" r="10" fill="#064E3B"/>
      <text x="14" y="18" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#6EE7B7">1</text>
      <text x="34" y="18" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Pinpoint AST &amp; Call-Graph Slicing (&lt;50ms)</text>
      <text x="34" y="38" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Pulls only the target function, class setup, and immediate callers onto the card.</text>

      <circle cx="14" cy="64" r="10" fill="#064E3B"/>
      <text x="14" y="68" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#6EE7B7">2</text>
      <text x="34" y="68" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Clean Desk After Every Step (Zero-Token Reset)</text>
      <text x="34" y="88" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#CBD5E1">Confirmed facts are stored as &lt;170-token receipts in the 4D vault; chat noise resets.</text>

      <circle cx="14" cy="114" r="10" fill="#064E3B"/>
      <text x="14" y="118" text-anchor="middle" font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#6EE7B7">3</text>
      <text x="34" y="118" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Measured Footprint Across Two Operating Modes</text>
      <text x="34" y="138" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#34D399" font-weight="700">Single-Pass (--beam-k=1): ~2,450 tok (16.4s) • Multi-Hunk (--beam-k=3): ~2,600 tok (75.1s)</text>
    </g>
  </g>
</svg>
